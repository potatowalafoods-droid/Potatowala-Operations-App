<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b1c0d">
<meta name="apple-mobile-web-app-title" content="Potatowala">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Potatowala Operations</title>
<link rel="preload" as="image" href="startup-photos/01.jpg">
<style>
html{background:#3b1c0d}
body{margin:0;min-height:100vh;display:grid;place-items:center;color:#fff;font:16px system-ui}
#startup-photos{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:linear-gradient(135deg,#703317,#28140e)}
#startup-photos img,#startup-photos::after{position:absolute;inset:0;width:100%;height:100%}
#startup-photos img{object-fit:cover;opacity:0;transition:opacity .55s ease;z-index:0}
#startup-photos img.is-visible{opacity:1;z-index:1;animation:startup-pan 2.8s ease-out both}
#startup-photos img.is-previous{opacity:1;transition:none;animation:none}
#startup-photos::after{content:"";z-index:2;background:radial-gradient(ellipse at center,#170c09c9,#170c0963)}
@keyframes startup-pan{from{transform:scale(1.08)}to{transform:scale(1.01)}}
@media(prefers-reduced-motion:reduce){#startup-photos img.is-visible{animation:none;transition:none}}
main{position:relative;z-index:3;text-align:center;padding:24px;text-shadow:0 2px 12px #1d0d07}
main img{border-radius:20px}
h1{font-size:clamp(1.65rem,5vw,2.5rem)}
button{padding:10px 18px;border:0;border-radius:8px;background:#fff;color:#3b1c0d;font:inherit;cursor:pointer}
</style></head><body>
<div id="startup-photos" aria-hidden="true">
  <img class="is-visible" src="startup-photos/01.jpg" alt="" fetchpriority="high">
  <img alt="">
</div>
<main><img src="icon-192.png" alt="" width="96" height="96">
<h1>Potatowala Operations</h1><p id="status" role="status">Connecting to Operations…</p>
<button type="button" id="retry" hidden>Retry</button></main>
<script>
const endpoint = 'https://script.google.com/macros/s/AKfycbyS6zZsCOZfulmv9GDHgurfjsNwReR7iTzvlGYOjeQQGWW1TUHBloZqcrhiFqp3-vRH/exec';
async function operationsRpc(method, ...args) {
  const response = await fetch(endpoint, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=UTF-8'},
    body: JSON.stringify({method, args}),
    credentials: 'omit',
  });
  if (!response.ok) throw Error('Operations could not be reached.');
  const result = await response.json();
  if (!result.ok) throw Error(result.error || 'Operations request failed.');
  return result.value;
}

function playStartupPhotos() {
  const photos = document.getElementById('startup-photos');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  let [current, next] = photos.querySelectorAll('img');
  let number = 1;

  async function showNext() {
    if (!photos.isConnected || motion.matches) return;
    if (!document.hidden) {
      number = number % 36 + 1;
      next.src = 'startup-photos/' + String(number).padStart(2, '0') + '.jpg';
      try {
        await next.decode();
        if (!photos.isConnected || motion.matches) return;
        current.className = 'is-previous';
        next.className = 'is-visible';
        [current, next] = [next, current];
      } catch {
        // Keep the current photo visible if the next one cannot load.
      }
    }
    setTimeout(showNext, 1800);
  }

  if (!motion.matches) setTimeout(showNext, 900);
}

async function openOperations() {
  const status = document.getElementById('status');
  const retry = document.getElementById('retry');
  status.textContent = 'Connecting to Operations…';
  retry.hidden = true;
  try {
    const html = await operationsRpc('pagesFrontend');
    if (typeof html !== 'string' || !/^<!doctype html>/i.test(html)) {
      throw Error('Unexpected Operations response.');
    }
    const portableHead = '<link rel="manifest" href="manifest.webmanifest">' +
      '<link rel="apple-touch-icon" href="apple-touch-icon.png">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<meta name="theme-color" content="#201d32"><title>Potatowala Operations</title>';
    document.open();
    document.write(html.replace('<head>', '<head>' + portableHead));
    document.close();
  } catch {
    status.textContent = 'Operations is unavailable. Check your connection and try again.';
    retry.hidden = false;
  }
}
document.getElementById('retry').addEventListener('click', openOperations);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
playStartupPhotos();
openOperations();
</script></body></html>
